name: Validate project 003

on:
  pull_request:
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-dark-suite.yml"
      - ".github/workflows/validate-project-003.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-dark-suite:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Verify and materialize Project 003 payload
        shell: bash
        run: |
          cat .bootstrap/part-* | base64 --decode > /tmp/dark-suite.tar.gz
          echo "1c3712fefca45234f90215d0e1dccee70872c9938099a801a3877b1d12aaeeb1  /tmp/dark-suite.tar.gz" | sha256sum --check
          tar -xzf /tmp/dark-suite.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-dark-suite.yml
      - name: Commit the reviewed source tree
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add dark-mode Wales rainfall and dryness suite"
          git push origin HEAD:"$HEAD_REF"
