name: Validate project 003

on:
  push:
    branches: [main]
    paths:
      - "projects/003-wales-rainfall/**"
      - "pyproject.toml"
      - ".github/workflows/validate-project-003.yml"
  pull_request:
    paths:
      - "projects/003-wales-rainfall/**"
      - "README.md"
      - "pyproject.toml"
      - ".github/workflows/validate-project-003.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Fetch exact Met Office rainfall source
        run: python projects/003-wales-rainfall/fetch_source.py --output-dir projects/003-wales-rainfall/data/raw
      - name: Unit and integration tests
        run: pytest -q
      - name: Build rainfall history and statistical baseline
        shell: bash
        run: |
          SOURCE=$(find projects/003-wales-rainfall/data/raw -name 'metoffice-wales-rainfall-retrieved-*.txt' | sort | tail -1)
          python projects/003-wales-rainfall/analysis.py --source "$SOURCE" --no-update-readme
      - name: Independent rainfall verification
        shell: bash
        run: |
          SOURCE=$(find projects/003-wales-rainfall/data/raw -name 'metoffice-wales-rainfall-retrieved-*.txt' | sort | tail -1)
          MANIFEST="${SOURCE%.txt}.provenance.json"
          python projects/003-wales-rainfall/verify.py --source "$SOURCE" --manifest "$MANIFEST"
      - name: Retain verified rainfall source and outputs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          SOURCE=$(find projects/003-wales-rainfall/data/raw -name 'metoffice-wales-rainfall-retrieved-*.txt' | sort | tail -1)
          MANIFEST="${SOURCE%.txt}.provenance.json"
          TMP=$(mktemp -d)
          cp "$SOURCE" "$TMP/source.txt"
          cp "$MANIFEST" "$TMP/provenance.json"

          git reset --hard
          git clean -fd
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"

          SOURCE_DATE=$(python - "$TMP/provenance.json" <<'PY'
          import json
          import sys
          from datetime import datetime
          value = json.load(open(sys.argv[1], encoding="utf-8"))["source_last_updated"].split()[0]
          print(datetime.strptime(value, "%d-%b-%Y").strftime("%Y-%m-%d"))
          PY
          )
          STABLE="$PWD/projects/003-wales-rainfall/data/raw/metoffice-wales-rainfall-source-${SOURCE_DATE}.txt"
          STABLE_MANIFEST=${STABLE%.txt}.provenance.json
          mkdir -p "$(dirname "$STABLE")"
          if [ -f "$STABLE" ]; then
            cmp "$TMP/source.txt" "$STABLE"
          else
            cp "$TMP/source.txt" "$STABLE"
            cp "$TMP/provenance.json" "$STABLE_MANIFEST"
          fi
          find projects/003-wales-rainfall/data/raw -name 'metoffice-wales-rainfall-retrieved-*' -delete

          python projects/003-wales-rainfall/analysis.py --source "$STABLE"
          python projects/003-wales-rainfall/verify.py --source "$STABLE" --manifest "$STABLE_MANIFEST"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/003-wales-rainfall
          if ! git diff --cached --quiet; then
            git commit -m "Retain verified Wales rainfall source and outputs"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:"$HEAD_REF"; then
                pushed=true
                break
              fi
              echo "Branch moved during retention push; rebasing attempt $attempt"
              git fetch origin "$HEAD_REF"
              git rebase "origin/$HEAD_REF"
            done
            test "$pushed" = true
          fi
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-003-validation-evidence
          path: |
            projects/003-wales-rainfall/data/raw/
            projects/003-wales-rainfall/data/derived/
            projects/003-wales-rainfall/figures/
            projects/003-wales-rainfall/README.md
            projects/003-wales-rainfall/METHODOLOGY.md
          if-no-files-found: error
