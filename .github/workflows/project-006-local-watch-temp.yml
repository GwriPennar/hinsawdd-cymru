name: Project 006 temporary Swansea Gower local watch

on:
  push:
    branches:
      - agent/project-006-swansea-gower-local-watch
    paths:
      - ".github/workflows/project-006-local-watch-temp.yml"

permissions:
  contents: read

env:
  NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}

jobs:
  run-local-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run Swansea Gower local watch
        run: |
          python projects/006-wildfire-watch/local_watch.py --hours 5 --output-root /tmp/swansea-gower-watch
          cat /tmp/swansea-gower-watch/data/derived/summary.json
      - name: Upload data outputs
        uses: actions/upload-artifact@v4
        with:
          name: swansea-gower-local-watch
          path: /tmp/swansea-gower-watch/data
