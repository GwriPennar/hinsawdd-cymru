name: Validate project 006

on:
  push:
    branches:
      - main
      - agent/project-006-wildfire-watch
    paths:
      - "projects/006-wildfire-watch/**"
      - "README.md"
      - "pyproject.toml"
      - ".github/workflows/validate-project-006.yml"
  pull_request:
    paths:
      - "projects/006-wildfire-watch/**"
      - "README.md"
      - "pyproject.toml"
      - ".github/workflows/validate-project-006.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q projects/006-wildfire-watch/tests

      - name: End-to-end retained-fixture build
        run: |
          python projects/006-wildfire-watch/build.py \
            --input-dir projects/006-wildfire-watch/tests/fixtures \
            --output-root /tmp/project-006-validation

      - name: Verify generated evidence and site
        run: |
          set -euo pipefail
          for file in \
            detections.csv \
            clustered_detections.csv \
            incidents.csv \
            incidents.geojson \
            summary.json
          do
            test -s "/tmp/project-006-validation/data/derived/${file}"
          done
          test -s /tmp/project-006-validation/site/index.html
          grep -q "not a confirmed wildfire" /tmp/project-006-validation/site/index.html
          if grep -q "NASA_FIRMS_MAP_KEY" /tmp/project-006-validation/site/index.html; then
            echo "Generated HTML leaked a credential variable name unexpectedly"
            exit 1
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-006-wildfire-watch-validation-evidence
          path: |
            /tmp/project-006-validation/data/derived/
            /tmp/project-006-validation/site/
          if-no-files-found: error
