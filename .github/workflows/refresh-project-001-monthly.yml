name: Refresh project 001 monthly

on:
  schedule:
    # Met Office Wales monthly tables usually update in the first week; run on the 5th at 08:00 UTC.
    - cron: "0 8 5 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Fetch latest Met Office source
        run: python projects/001-rolling-temperature/fetch_source.py --output-dir projects/001-rolling-temperature/data/raw
      - name: Monthly refresh pipeline
        run: python projects/001-rolling-temperature/refresh.py
      - name: Run tests
        run: pytest -q projects/001-rolling-temperature/tests
      - name: Commit monthly refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md projects/001-rolling-temperature
          if ! git diff --cached --quiet; then
            git commit -m "Monthly Project 001 refresh: rolling 12-month window to latest published month."
            git push origin main
          fi
