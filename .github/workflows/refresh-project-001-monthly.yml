name: Refresh project 001 monthly

on:
  schedule:
    # Met Office Wales monthly tables usually update in the first week; run on the 5th at 08:00 UTC.
    - cron: "0 8 5 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Fetch latest Met Office source
        run: python projects/001-rolling-temperature/fetch_source.py --output-dir projects/001-rolling-temperature/data/raw
      - name: Rebuild analysis and monthly monitor
        run: |
          python projects/001-rolling-temperature/analysis.py --no-update-readme
          python projects/001-rolling-temperature/verify.py \
            --source "$(find projects/001-rolling-temperature/data/raw -name 'metoffice-wales-tmean-retrieved-*.txt' | sort | tail -1)" \
            --manifest "$(find projects/001-rolling-temperature/data/raw -name 'metoffice-wales-tmean-retrieved-*.txt' | sort | tail -1 | sed 's/.txt$/.provenance.json/')" \
            --require-annual \
            --primary-summary projects/001-rolling-temperature/data/derived/summary.json
          python projects/001-rolling-temperature/monthly_monitor.py
          python projects/001-rolling-temperature/social_chart.py
          python projects/001-rolling-temperature/warming_stripes.py
          python projects/001-rolling-temperature/august_to_july_stripes.py
          python projects/001-rolling-temperature/line_chart_variants.py --update-readmes
          pytest -q projects/001-rolling-temperature/tests
      - name: Update generated README headline block
        run: python projects/001-rolling-temperature/analysis.py
      - name: Commit monthly refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md projects/001-rolling-temperature
          if ! git diff --cached --quiet; then
            git commit -m "Monthly Project 001 refresh: rolling 12-month window to latest published month."
            git push origin main
          fi
