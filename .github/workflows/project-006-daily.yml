name: Project 006 daily wildfire watch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/project-006-daily.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-006-daily-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Check FIRMS secret
        run: test -n "${NASA_FIRMS_MAP_KEY:-}"
      - name: Initial 60-day history backfill
        run: |
          if [ ! -s projects/006-wildfire-watch/data/history/detections.csv ]; then
            python projects/006-wildfire-watch/history.py --days 60
          fi
      - name: Build latest two-day view
        run: |
          rm -rf projects/006-wildfire-watch/published
          python projects/006-wildfire-watch/build.py --days 2 --bbox uk --output-root projects/006-wildfire-watch/published
          python projects/006-wildfire-watch/scientific_map.py --output-root projects/006-wildfire-watch/published
          python projects/006-wildfire-watch/stamp_maps.py --output-root projects/006-wildfire-watch/published
      - name: Add direct map links
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import pandas as pd
          root = Path('projects/006-wildfire-watch')
          spec = importlib.util.spec_from_file_location('location_links', root / 'location_links.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          path = root / 'published/data/derived/wales_candidate_locations.csv'
          mod.add_location_links(pd.read_csv(path)).to_csv(path, index=False)
          PY
      - name: Correlate external incidents
        run: python projects/006-wildfire-watch/corroboration.py --output-root projects/006-wildfire-watch/published --register projects/006-wildfire-watch/data/reference/external_wildfire_incidents.csv
      - name: Append cumulative history
        run: python projects/006-wildfire-watch/history.py --append-detections projects/006-wildfire-watch/published/data/derived/detections.csv
      - name: Verify outputs
        run: |
          test -s projects/006-wildfire-watch/data/history/detections.csv
          test -s projects/006-wildfire-watch/data/history/daily_summary.csv
          test -s projects/006-wildfire-watch/published/data/derived/wales_candidate_locations_corroborated.csv
          test -s projects/006-wildfire-watch/published/figures/wales_wildfire_watch_dark.png
          grep -q openstreetmap_url projects/006-wildfire-watch/published/data/derived/wales_candidate_locations.csv
          grep -q google_maps_url projects/006-wildfire-watch/published/data/derived/wales_candidate_locations.csv
      - name: Record publication status
        if: always()
        run: |
          state="${{ job.status }}"
          if [ "$state" = "success" ]; then
            python projects/006-wildfire-watch/publication_status.py --state success
          else
            python projects/006-wildfire-watch/publication_status.py --state failure
          fi
      - name: Publish refreshed evidence and status to main
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ job.status }}" = "success" ]; then
            git add projects/006-wildfire-watch/data/history projects/006-wildfire-watch/published projects/006-wildfire-watch/README.md
          else
            git add projects/006-wildfire-watch/README.md
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Project 006 daily wildfire watch"
            git push origin HEAD:main
          fi
