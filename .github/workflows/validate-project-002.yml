name: Validate project 002

on:
  push:
    branches: [main]
    paths:
      - "projects/002-temperature-pathways/**"
      - "projects/001-rolling-temperature/data/**"
      - "projects/001-rolling-temperature/verify.py"
      - "pyproject.toml"
      - ".github/workflows/validate-project-002.yml"
  pull_request:
    paths:
      - "projects/002-temperature-pathways/**"
      - "projects/001-rolling-temperature/data/**"
      - "projects/001-rolling-temperature/verify.py"
      - "README.md"
      - "pyproject.toml"
      - ".github/workflows/validate-project-002.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify retained Project 001 source and result
        run: |
          python projects/001-rolling-temperature/verify.py \
            --source projects/001-rolling-temperature/data/raw/metoffice-wales-tmean-source-2026-07-01.txt \
            --manifest projects/001-rolling-temperature/data/raw/metoffice-wales-tmean-source-2026-07-01.provenance.json \
            --require-annual \
            --primary-summary projects/001-rolling-temperature/data/derived/summary.json \
            --json-out build/project-001-verification.json
      - name: Unit and integration tests
        run: pytest -q
      - name: Build Project 002 statistical baseline
        run: python projects/002-temperature-pathways/model.py
      - name: Independent Project 002 verification
        run: python projects/002-temperature-pathways/verify.py
      - name: Retain verified Project 002 outputs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          git reset --hard
          git clean -fd
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"

          python projects/001-rolling-temperature/verify.py \
            --source projects/001-rolling-temperature/data/raw/metoffice-wales-tmean-source-2026-07-01.txt \
            --manifest projects/001-rolling-temperature/data/raw/metoffice-wales-tmean-source-2026-07-01.provenance.json \
            --require-annual \
            --primary-summary projects/001-rolling-temperature/data/derived/summary.json \
            --json-out build/project-001-verification.json
          python projects/002-temperature-pathways/model.py
          python projects/002-temperature-pathways/verify.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/002-temperature-pathways
          if ! git diff --cached --quiet; then
            git commit -m "Retain verified Project 002 outputs"
            git push origin HEAD:"$HEAD_REF"
          fi
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-002-validation-evidence
          path: |
            build/
            projects/001-rolling-temperature/data/raw/metoffice-wales-tmean-source-2026-07-01.txt
            projects/001-rolling-temperature/data/raw/metoffice-wales-tmean-source-2026-07-01.provenance.json
            projects/001-rolling-temperature/data/derived/summary.json
            projects/001-rolling-temperature/data/derived/independent_verification.json
            projects/002-temperature-pathways/
          if-no-files-found: error
