<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wales · VIIRS heat anomalies (history GIF)</title>
  <style>
    :root {
      --bg: #080c16;
      --text: #f8fafc;
      --muted: #94a3b8;
      --cyan: #22d3ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      max-width: 40rem;
    }
    p span { color: var(--cyan); }
    img {
      width: min(96vw, 1280px);
      height: auto;
      border: 1px solid #334155;
      background: #0f172a;
    }
  </style>
</head>
<body>
  <h1>Wales · VIIRS heat anomalies</h1>
  <p>
    Animated GIF · 15 Jun–21 Aug 2026 · 4 fps ·
    <span>thermal anomalies, not confirmed wildfires</span>
  </p>
  <img
    src="wales_heat_anomalies_history_dark.gif"
    alt="Day-by-day animation of VIIRS heat anomalies across Wales"
    width="1280"
    height="720"
  />
  <p>If this still looks static, hard-refresh the page (⌘⇧R).</p>
</body>
</html>
