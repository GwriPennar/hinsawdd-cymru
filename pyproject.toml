[project]
name = "hinsawdd-cymru"
version = "0.1.0"
description = "Open and reproducible analysis of public weather and climate data for Wales"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "pandas>=2.2",
  "requests>=2.32",
  "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
sst = [
  "numpy>=1.26",
  "scipy>=1.11",
  "xarray>=2024.10",
  "h5netcdf>=1.3",
  "copernicusmarine>=2.0",
]

[tool.setuptools.packages.find]
exclude = ["secrets*", "projects*", "tests*"]

[tool.pytest.ini_options]
testpaths = [
  "projects/001-rolling-temperature/tests",
  "projects/002-temperature-pathways/tests",
  "projects/003-wales-rainfall/tests",
  "projects/007-wales-coastal-sst/tests",
]
